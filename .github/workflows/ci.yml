name: Frappe Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frappe-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE_PROJECT_NAME: order-management-ci

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker compose build

      - name: Start fresh site and wait for healthy web
        run: docker compose up -d --no-build --wait --wait-timeout 300

      - name: Run server, form and initialization tests
        run: docker compose exec -T backend bash apps/order_management/docker/test.sh

      - name: Publish tested image to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag order-management:local "$image:$GITHUB_SHA"
          docker tag order-management:local "$image:latest"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"

      - name: Show container logs
        if: always()
        run: docker compose logs --no-color --tail 100

      - name: Remove temporary CI containers and data
        if: always()
        run: docker compose down --volumes
