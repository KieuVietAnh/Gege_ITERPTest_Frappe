name: Frappe CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frappe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FRAPPE_VERSION: v15.126.1
      BENCH_VERSION: 5.31.1
      CI_DB_PASSWORD: ci-database-only
      CI_ADMIN_PASSWORD: ci-administrator-only

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-database-only
          MARIADB_ROOT_HOST: '%'
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis-cache:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:13000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis-queue:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:11000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config mariadb-client libmariadb-dev \
            libffi-dev libssl-dev libjpeg-dev zlib1g-dev \
            libpango-1.0-0 libpangoft2-1.0-0
          npm install --global --force yarn@1.22.22

      - name: Install Bench CLI
        run: |
          python -m venv "$RUNNER_TEMP/bench-cli"
          "$RUNNER_TEMP/bench-cli/bin/pip" install "frappe-bench==$BENCH_VERSION"
          echo "$RUNNER_TEMP/bench-cli/bin" >> "$GITHUB_PATH"

      - name: Create Frappe Bench and install app source
        run: |
          bench init --frappe-branch "$FRAPPE_VERSION" --python python3.12 \
            --skip-assets --no-backups "$RUNNER_TEMP/frappe-bench"
          cd "$RUNNER_TEMP/frappe-bench"
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000
          bench get-app --skip-assets --soft-link "$GITHUB_WORKSPACE"

      - name: Create isolated test site
        run: |
          cd "$RUNNER_TEMP/frappe-bench"
          bench new-site ci.localhost --db-type mariadb --db-host 127.0.0.1 --db-port 3306 \
            --db-root-username root --db-root-password "$CI_DB_PASSWORD" \
            --admin-password "$CI_ADMIN_PASSWORD" --mariadb-user-host-login-scope='%'
          bench --site ci.localhost install-app order_management
          bench --site ci.localhost set-config allow_tests true

      - name: Run server and frontend tests
        run: |
          cd "$RUNNER_TEMP/frappe-bench"
          bench --site ci.localhost run-tests --app order_management
          node apps/order_management/tests/simple-order-form.test.cjs

      - name: Build frontend assets
        run: |
          cd "$RUNNER_TEMP/frappe-bench"
          bench build

      - name: Package app and source
        run: |
          uv build --wheel --python "$RUNNER_TEMP/frappe-bench/env/bin/python" \
            --out-dir "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE"
          git archive --format=zip --prefix=order_management/ \
            --output=dist/order-management-source.zip HEAD

      - name: Upload submission artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: order-management-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
